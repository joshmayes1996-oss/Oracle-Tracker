<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oracle Team Time</title><style>body{font:16px system-ui;margin:0;background:#000;color:#fff}.app{max-width:950px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;border-bottom:3px solid #c74634}.card{background:#fff;color:#18232c;border:1px solid #dfe5ea;border-radius:12px;padding:18px;margin-top:18px}input,select,button{padding:10px;border:1px solid #cbd5dd;border-radius:7px;font:inherit;margin:4px}button{background:#c74634;color:#fff;border:0;font-weight:700}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}.muted{color:#607080}</style></head><body><main class="app"><header class="head"><h1>Oracle Team Time</h1><button id="managerButton">Manager sign in</button></header><section class="card"><h2>Employee clock</h2><p>Enter your own first and last name.</p><input id="first" placeholder="First name"><input id="last" placeholder="Last name"><p><button id="clockIn">Check in</button><button id="clockOut">Check out</button></p><p id="message" class="muted"></p></section><section id="dashboard" class="card hidden"><button id="refresh">Refresh dashboard</button><button id="signOut">Sign out</button><h2>Manager dashboard</h2><h3>Add employee</h3><input id="newFirst" placeholder="First name"><input id="newLast" placeholder="Last name"><select id="team"><option>Team 1</option><option>Team 2</option><option>Team 3</option><option>Team 4</option><option>Team 5</option><option>Management</option></select><button id="add">Add employee</button><h3>Employees</h3><table><tbody id="employees"></tbody></table><h3>Time records</h3><table><tbody id="records"></tbody></table></section></main><dialog id="login"><form id="loginForm"><h2>Manager sign in</h2><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const PROJECT_URL='https://dbaiwdatialqkywacxok.supabase.co',PUBLISHABLE_KEY='sb_publishable_a2CkKxXlGpZhcaj8OCL-yg_2qAeEhvf',q=s=>document.querySelector(s);let db;
function message(t){q('#message').textContent=t}if(PROJECT_URL.indexOf('http')===0)db=supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);else message('Manager: add the Supabase Project URL and publishable key in this file first.');
async function clock(action){if(!db)return;const r=await fetch(PROJECT_URL+'/functions/v1/manager-clock',{method:'POST',headers:{'Content-Type':'application/json','apikey':PUBLISHABLE_KEY},body:JSON.stringify({first:q('#first').value,last:q('#last').value,action})});const x=await r.json();message(x.error||x.message)}
q('#clockIn').onclick=()=>clock('in');q('#clockOut').onclick=()=>clock('out');q('#managerButton').onclick=()=>q('#login').showModal();q('#loginForm').onsubmit=async e=>{e.preventDefault();const x=await db.auth.signInWithPassword({email:q('#email').value,password:q('#password').value});if(x.error)return alert(x.error.message);q('#login').close();q('#dashboard').classList.remove('hidden');load()};
async function load(){const p=await db.from('employees').select('*').eq('active',true).order('last_name'),r=await db.from('time_entries').select('*,employees(first_name,last_name)').order('check_in',{ascending:false});if(p.error)throw new Error(p.error.message);if(r.error)throw new Error(r.error.message);q('#employees').innerHTML='<tr><th>Name</th><th>Team</th><th>Status</th><th></th></tr>'+p.data.map(x=>'<tr><td>'+x.first_name+' '+x.last_name+'</td><td>'+x.team+'</td><td>Active</td><td><button data-archive="'+x.id+'">Archive</button></td></tr>').join('');q('#records').innerHTML='<tr><th>Employee</th><th>Check in</th><th>Check out</th><th></th></tr>'+r.data.map(x=>'<tr><td>'+x.employees.first_name+' '+x.employees.last_name+'</td><td>'+new Date(x.check_in).toLocaleString()+'</td><td>'+(x.check_out?new Date(x.check_out).toLocaleString():'—')+'</td><td><button data-delete-record="'+x.id+'">Delete</button></td></tr>').join('')}
q('#add').onclick=async()=>{const first=q('#newFirst').value.trim(),last=q('#newLast').value.trim(),team=q('#team').value;if(!first||!last)return alert('Enter both a first and last name.');const x=await db.from('employees').upsert({first_name:first,last_name:last,team:team,active:true},{onConflict:'first_name,last_name'});if(x.error)alert(x.error.message);else{q('#newFirst').value='';q('#newLast').value='';await load()}};q('#signOut').onclick=async()=>{await db.auth.signOut();location.reload()};
</script><script>
const logo=document.createElement('img');logo.src='oracle.webp';logo.alt='Oracle';logo.style.cssText='width:145px;height:auto;display:block;margin-right:14px';q('.head h1').replaceWith(logo);
</script><script>
q('#dashboard').insertAdjacentHTML('beforeend','<h3>Dashboard</h3><div id="stats" class="card"></div><h3>Weekly hours</h3><input id="week" type="week"><table><tbody id="weekly"></tbody></table><h3>Manager edit history</h3><button id="clearAudit">Clear edit history</button><table><tbody id="audit"></tbody></table>');
const baseLoad=load;load=async()=>{await baseLoad();const r=await db.from('time_entries').select('*,employees(first_name,last_name,team)').order('check_in',{ascending:false});const e=r.data||[],open=e.filter(x=>!x.check_out);q('#stats').textContent='Currently clocked in: '+open.length+' | Total records: '+e.length;const start=new Date();start.setDate(start.getDate()-((start.getDay()+6)%7));start.setHours(0,0,0,0);const t={};e.filter(x=>new Date(x.check_in)>=start).forEach(x=>{const n=x.employees.first_name+' '+x.employees.last_name;t[n]=(t[n]||0)+Math.round(((x.check_out?new Date(x.check_out):new Date())-new Date(x.check_in))/60000)});q('#weekly').innerHTML='<tr><th>Employee</th><th>Hours</th></tr>'+Object.entries(t).map(x=>'<tr><td>'+x[0]+'</td><td>'+Math.floor(x[1]/60)+'h '+x[1]%60+'m</td></tr>').join('');const a=await db.from('audit_log').select('*').order('occurred_at',{ascending:false}).limit(30);q('#audit').innerHTML='<tr><th>When</th><th>Action</th><th>Entity</th></tr>'+(a.data||[]).map(x=>'<tr><td>'+new Date(x.occurred_at).toLocaleString()+'</td><td>'+x.action+'</td><td>'+x.entity+'</td></tr>').join('')};q('#week').onchange=load;
</script><script>q('#refresh').onclick=async()=>{const b=q('#refresh');b.disabled=true;b.textContent='Refreshing…';try{await load();alert('Dashboard updated.')}catch(e){alert('Could not refresh: '+e.message)}finally{b.disabled=false;b.textContent='Refresh dashboard'}};q('#employees').onclick=async e=>{const id=e.target.dataset.archive;if(!id||!confirm('Archive this employee? Their past records will stay saved.'))return;const r=await db.from('employees').update({active:false}).eq('id',id);if(r.error)alert(r.error.message);else{try{await load()}catch(e){alert('Employee archived, but the dashboard could not refresh: '+e.message)}}};q('#records').onclick=async e=>{const id=e.target.dataset.deleteRecord;if(!id||!confirm('Delete this time record permanently?'))return;const r=await db.from('time_entries').delete().eq('id',id);if(r.error)alert(r.error.message);else{try{await load()}catch(e){alert('Record deleted, but the dashboard could not refresh: '+e.message)}}};q('#clearAudit').onclick=async()=>{if(!confirm('Clear all manager edit history? This cannot be undone.'))return;const r=await db.from('audit_log').delete().neq('id',0);if(r.error)return alert(r.error.message);await load();alert('Manager edit history cleared.')};</script></body></html>
