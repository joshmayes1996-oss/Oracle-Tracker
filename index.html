<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oracle Team Time</title>
<style>
:root{--red:#c74634;--ink:#17232d;--muted:#627282;--line:#d9e1e7}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1050px;margin:auto;padding:20px}.head{display:flex;gap:16px;align-items:center;justify-content:space-between;border-bottom:3px solid var(--red);padding-bottom:12px}.logo{width:145px;height:auto;display:block}.card{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px}.hidden{display:none}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f5f7f9;border-radius:10px;padding:12px}.stat b{font-size:1.35rem;display:block}input,select,button{min-height:42px;padding:9px 11px;border:1px solid #cbd5dd;border-radius:8px;font:inherit}input,select{background:#fff;color:var(--ink)}button{background:var(--red);color:#fff;border:0;font-weight:700;cursor:pointer}button.secondary{background:#52616d}button.danger{background:#9f2e22}button:disabled{opacity:.65;cursor:wait}.message{min-height:24px;color:var(--muted);margin:10px 0 0}.success{color:#137445}.warning{color:#a45900}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#f5f7f9}.note{max-width:250px;white-space:normal}.small{font-size:.88rem;color:var(--muted)}dialog{border:0;border-radius:14px;max-width:420px;width:calc(100% - 32px);padding:0}dialog form{padding:22px;display:grid;gap:10px}.filters{background:#f5f7f9;border-radius:10px;padding:12px;margin:12px 0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}@media(max-width:640px){.app{padding:14px}.head{align-items:flex-start}.logo{width:118px}.split,.stats{grid-template-columns:1fr}.card{padding:15px}input,select,button{width:100%;margin:0}.row>*{flex:1 1 100%}.row button{flex-basis:auto}.head button{width:auto}.filters .row>*{flex-basis:100%}}
</style></head><body><main class="app">
<header class="head"><img class="logo" src="oracle.webp" alt="Oracle"><button id="managerButton">Manager sign in</button></header>
<section class="card"><h2>Employee clock</h2><p class="small">Enter your own first and last name. Names ignore upper/lower case and extra spaces.</p><div class="row"><input id="first" autocomplete="given-name" placeholder="First name"><input id="last" autocomplete="family-name" placeholder="Last name"><input id="note" placeholder="Optional note"></div><div class="row" style="margin-top:10px"><button id="clockIn">Check in</button><button id="clockOut" class="secondary">Check out</button></div><p id="message" class="message" aria-live="polite"></p></section>
<section id="dashboard" class="card hidden"><div class="section-head"><h2>Manager dashboard</h2><div class="row"><button id="refresh" class="secondary">Refresh dashboard</button><button id="signOut">Sign out</button></div></div><div class="stats" id="stats"></div><p id="warning" class="message warning"></p>
<div class="split"><div><h3>Add or restore employee</h3><div class="row"><input id="newFirst" placeholder="First name"><input id="newLast" placeholder="Last name"><select id="team"><option>Team 1</option><option>Team 2</option><option>Team 3</option><option>Team 4</option><option>Team 5</option><option>Management</option></select><button id="add">Save employee</button></div><p class="small">Using an archived employee’s name restores them.</p></div><div><h3>Weekly hours report</h3><div class="row"><input id="week" type="week"><button id="exportWeek" class="secondary">Download weekly CSV</button></div><div class="table-wrap"><table><tbody id="weekly"></tbody></table></div></div></div>
<h3>Active employees</h3><div class="table-wrap"><table><tbody id="employees"></tbody></table></div><div class="section-head"><h3>Time records</h3><button id="exportRecords" class="secondary">Download filtered CSV</button></div><div class="filters"><div class="row"><select id="filterEmployee"><option value="">All employees</option></select><select id="filterTeam"><option value="">All teams</option></select><input id="from" type="date" title="From date"><input id="to" type="date" title="To date"><label><input id="openOnly" type="checkbox"> Open shifts only</label><button id="clearFilters" class="secondary">Clear filters</button></div></div><div class="table-wrap"><table><tbody id="records"></tbody></table></div><div class="section-head"><h3>Manager edit history</h3><button id="clearAudit" class="danger">Clear edit history</button></div><div class="table-wrap"><table><tbody id="audit"></tbody></table></div></section></main>
<dialog id="login"><form id="loginForm"><h2>Manager sign in</h2><input id="email" type="email" autocomplete="email" placeholder="Email" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button>Sign in</button><button type="button" id="cancelLogin" class="secondary">Cancel</button></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const PROJECT_URL='https://dbaiwdatialqkywacxok.supabase.co',PUBLISHABLE_KEY='sb_publishable_a2CkKxXlGpZhcaj8OCL-yg_2qAeEhvf';const q=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let db,allEntries=[],activeEmployees=[];const clean=s=>s.trim().replace(/\s+/g,' ');
function say(t,kind=''){const e=q('#message');e.textContent=t;e.className='message '+kind}if(PROJECT_URL.startsWith('http'))db=supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);else say('Manager setup needed: add the Supabase Project URL and publishable key to this file first.','warning');
async function clock(action){if(!db)return;const first=clean(q('#first').value),last=clean(q('#last').value);if(!first||!last)return say('Enter both your first and last name.','warning');const buttons=[q('#clockIn'),q('#clockOut')];buttons.forEach(b=>b.disabled=true);try{const r=await fetch(PROJECT_URL+'/functions/v1/manager-clock',{method:'POST',headers:{'Content-Type':'application/json','apikey':PUBLISHABLE_KEY},body:JSON.stringify({first,last,note:clean(q('#note').value),action})});const x=await r.json();if(!r.ok||x.error)throw new Error(x.error||'Clock action failed.');say(x.message||('You checked '+(action==='in'?'in':'out')+'.'),'success');if(action==='in')q('#note').value=''}catch(e){say(e.message,'warning')}finally{buttons.forEach(b=>b.disabled=false)}}
q('#clockIn').onclick=()=>clock('in');q('#clockOut').onclick=()=>clock('out');q('#managerButton').onclick=()=>q('#login').showModal();q('#cancelLogin').onclick=()=>q('#login').close();q('#loginForm').onsubmit=async e=>{e.preventDefault();if(!db)return;const x=await db.auth.signInWithPassword({email:q('#email').value,password:q('#password').value});if(x.error)return alert(x.error.message);q('#login').close();q('#dashboard').classList.remove('hidden');await load()};
const localTime=d=>new Date(d).toLocaleString();function weekStart(v){if(v){const [y,w]=v.split('-W').map(Number),d=new Date(y,0,4);d.setDate(d.getDate()-((d.getDay()+6)%7)+(w-1)*7);d.setHours(0,0,0,0);return d}const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));d.setHours(0,0,0,0);return d}function weekValue(d=new Date()){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return x.getUTCFullYear()+'-W'+String(Math.ceil((((x-y)/86400000)+1)/7)).padStart(2,'0')}function hours(x){return Math.max(0,((x.check_out?new Date(x.check_out):new Date())-new Date(x.check_in))/3600000)}
function filtered(){const e=q('#filterEmployee').value,t=q('#filterTeam').value,from=q('#from').value,to=q('#to').value,open=q('#openOnly').checked;return allEntries.filter(x=>{const d=x.employees||{},day=x.check_in.slice(0,10);return(!e||x.employee_id===e)&&(!t||d.team===t)&&(!from||day>=from)&&(!to||day<=to)&&(!open||!x.check_out)})}function renderRecords(){const rows=filtered();q('#records').innerHTML='<tr><th>Employee</th><th>Team</th><th>Check in</th><th>Check out</th><th>Hours</th><th>Note</th><th></th></tr>'+rows.map(x=>{const d=x.employees||{};return '<tr><td>'+esc(d.first_name)+' '+esc(d.last_name)+'</td><td>'+esc(d.team)+'</td><td>'+localTime(x.check_in)+'</td><td>'+(x.check_out?localTime(x.check_out):'Open')+'</td><td>'+hours(x).toFixed(2)+'</td><td class="note">'+esc(x.note||'—')+'</td><td><button class="danger" data-delete-record="'+x.id+'">Delete</button></td></tr>'}).join('')}
function renderWeekly(){const start=weekStart(q('#week').value),end=new Date(start);end.setDate(end.getDate()+7);const totals={};allEntries.filter(x=>new Date(x.check_in)>=start&&new Date(x.check_in)<end).forEach(x=>{const d=x.employees||{},name=d.first_name+' '+d.last_name;totals[name]=(totals[name]||0)+hours(x)});q('#weekly').innerHTML='<tr><th>Employee</th><th>Hours</th></tr>'+Object.entries(totals).sort().map(([n,h])=>'<tr><td>'+esc(n)+'</td><td>'+h.toFixed(2)+'</td></tr>').join('')}
function renderDashboard(){const open=allEntries.filter(x=>!x.check_out),old=open.filter(x=>Date.now()-new Date(x.check_in)>18*3600000);q('#stats').innerHTML='<div class="stat"><b>'+activeEmployees.length+'</b>Active employees</div><div class="stat"><b>'+open.length+'</b>Clocked in now</div><div class="stat"><b>'+allEntries.length+'</b>Total records</div>';q('#warning').textContent=old.length?old.length+' open shift'+(old.length===1?'':'s')+' started more than 18 hours ago. Review them in Time records.':'';renderWeekly();renderRecords()}function options(){q('#filterEmployee').innerHTML='<option value="">All employees</option>'+activeEmployees.map(x=>'<option value="'+x.id+'">'+esc(x.first_name)+' '+esc(x.last_name)+'</option>').join('');q('#filterTeam').innerHTML='<option value="">All teams</option>'+[...new Set(activeEmployees.map(x=>x.team))].sort().map(t=>'<option>'+esc(t)+'</option>').join('')}
async function load(){const [p,r,a]=await Promise.all([db.from('employees').select('*').eq('active',true).order('last_name'),db.from('time_entries').select('*,employees(first_name,last_name,team)').order('check_in',{ascending:false}),db.from('audit_log').select('*').order('occurred_at',{ascending:false}).limit(100)]);if(p.error)throw new Error(p.error.message);if(r.error)throw new Error(r.error.message);activeEmployees=p.data||[];allEntries=r.data||[];q('#employees').innerHTML='<tr><th>Name</th><th>Team</th><th>Status</th><th></th></tr>'+activeEmployees.map(x=>'<tr><td>'+esc(x.first_name)+' '+esc(x.last_name)+'</td><td>'+esc(x.team)+'</td><td>Active</td><td><button data-archive="'+x.id+'">Archive</button></td></tr>').join('');options();renderDashboard();q('#audit').innerHTML='<tr><th>When</th><th>Action</th><th>Area</th></tr>'+(a.data||[]).map(x=>'<tr><td>'+localTime(x.occurred_at)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.entity)+'</td></tr>').join('')}
async function refresh(){const b=q('#refresh');b.disabled=true;b.textContent='Refreshing…';try{await load();alert('Dashboard updated.')}catch(e){alert('Could not refresh: '+e.message)}finally{b.disabled=false;b.textContent='Refresh dashboard'}}q('#refresh').onclick=refresh;q('#add').onclick=async()=>{const first=clean(q('#newFirst').value),last=clean(q('#newLast').value);if(!first||!last)return alert('Enter both a first and last name.');const x=await db.from('employees').upsert({first_name:first,last_name:last,team:q('#team').value,active:true},{onConflict:'first_name,last_name'});if(x.error)return alert(x.error.message);q('#newFirst').value=q('#newLast').value='';await load()};q('#employees').onclick=async e=>{const id=e.target.dataset.archive;if(!id||!confirm('Archive this employee? Their past records stay saved.'))return;const r=await db.from('employees').update({active:false}).eq('id',id);if(r.error)return alert(r.error.message);await load()};q('#records').onclick=async e=>{const id=e.target.dataset.deleteRecord;if(!id||!confirm('Delete this time record permanently?'))return;const r=await db.from('time_entries').delete().eq('id',id);if(r.error)return alert(r.error.message);await load()};q('#clearAudit').onclick=async()=>{if(!confirm('Clear all manager edit history? This cannot be undone.'))return;const r=await db.from('audit_log').delete().neq('id',0);if(r.error)return alert(r.error.message);await load();alert('Manager edit history cleared.')};
['filterEmployee','filterTeam','from','to','openOnly'].forEach(id=>q('#'+id).onchange=renderRecords);q('#week').onchange=renderWeekly;q('#clearFilters').onclick=()=>{q('#filterEmployee').value=q('#filterTeam').value=q('#from').value=q('#to').value='';q('#openOnly').checked=false;renderRecords()};function csv(name,rows){const text=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}q('#exportRecords').onclick=()=>csv('oracle-time-records.csv',[['Employee','Team','Check in','Check out','Hours','Note'],...filtered().map(x=>{const d=x.employees||{};return[d.first_name+' '+d.last_name,d.team,x.check_in,x.check_out||'',hours(x).toFixed(2),x.note||'']})]);q('#exportWeek').onclick=()=>{const start=weekStart(q('#week').value),end=new Date(start);end.setDate(end.getDate()+7);const t={};allEntries.filter(x=>new Date(x.check_in)>=start&&new Date(x.check_in)<end).forEach(x=>{const d=x.employees||{},n=d.first_name+' '+d.last_name;t[n]=(t[n]||0)+hours(x)});csv('oracle-weekly-hours-'+q('#week').value+'.csv',[['Employee','Hours'],...Object.entries(t).map(([n,h])=>[n,h.toFixed(2)])])};q('#signOut').onclick=async()=>{await db.auth.signOut();location.reload()};q('#week').value=weekValue();
</script></body></html>
